<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111f">
<title>Kairo Send Files</title>
<style>
  :root { --bg:#14111f; --card:#1f1b2e; --line:#2f2944; --text:#efedf6; --muted:#a39dba; --accent:#a98bff; --ok:#5fd394; --err:#ff7a7a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:22px; margin:4px 0 2px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; }
  h2 { font-size:16px; margin:0 0 12px; }
  .drop { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:150px; border:2px dashed var(--line); border-radius:14px; text-align:center; padding:16px; cursor:pointer; }
  .drop.over { border-color:var(--accent); background:#241f38; }
  .drop b { font-size:18px; }
  .btn { display:inline-block; background:var(--accent); color:#14111f; border:0; border-radius:999px; padding:11px 20px; font:600 15px system-ui,sans-serif; cursor:pointer; }
  .btn:disabled { opacity:.5; }
  textarea { width:100%; min-height:80px; resize:vertical; background:#16131f; color:var(--text); border:1px solid var(--line); border-radius:12px; padding:12px; font:inherit; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { color:var(--muted); font-size:13px; }
  .bar { height:6px; background:#16131f; border-radius:3px; overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  a.dl { color:var(--accent); text-decoration:none; font-weight:600; white-space:nowrap; }
  button.del { background:none; border:0; color:var(--err); font:600 15px system-ui,sans-serif; cursor:pointer; padding:4px 0; padding-inline-start:8px; }
  .empty { color:var(--muted); }
  .actions { display:flex; justify-content:flex-end; margin-top:10px; }
</style>
</head>
<body>
<main>
  <h1>Kairo Send Files</h1>
  <p class="sub" data-t="web_subtitle">Envoyez des fichiers à la TV, ou récupérez ceux que la box vous propose.</p>

  <section class="card">
    <h2 data-t="web_send_title">Envoyer à la TV</h2>
    <label class="drop" id="drop">
      <b data-t="web_pick">Choisir des fichiers</b>
      <span class="meta" data-t="web_pick_hint">ou glissez-les ici · vidéos, photos, APK, documents…</span>
      <input type="file" id="pick" multiple hidden>
    </label>
    <div id="queue"></div>
  </section>

  <section class="card">
    <h2 data-t="web_text_title">Envoyer un texte ou un lien</h2>
    <textarea id="text" placeholder="Un lien s'ouvre directement sur la TV" data-t-placeholder="web_text_placeholder"></textarea>
    <div class="actions"><button class="btn" id="sendText" data-t="web_send">Envoyer</button></div>
    <div id="textState" class="meta"></div>
  </section>

  <section class="card">
    <h2 data-t="web_box_title">Sur la box</h2>
    <div id="files"><p class="empty" data-t="web_loading">Chargement…</p></div>
  </section>
</main>
<!-- Textes dans la langue de la page (celle du navigateur, sinon de la box), insérés par le serveur. -->
<script id="i18n" type="application/json">/*I18N*/{}</script>
<script>
(() => {
  const key = new URLSearchParams(location.search).get('k') || '';
  const q = (s) => document.querySelector(s);
  // Textes de res/values*/strings.xml (web_…, size_…) dans la langue de la page.
  let T = {};
  try { T = JSON.parse(q('#i18n').textContent.replace('/*I18N*/', '')); } catch (e) { /* page sans traduction */ }
  const t = (k, ...args) => (T[k] || k)
    .replace(/%(\d+)\$[sd]/g, (m, n) => String(args[n - 1]))
    .replace(/%%/g, '%');
  document.querySelectorAll('[data-t]').forEach((el) => { if (T[el.dataset.t]) el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-t-placeholder]').forEach((el) => { if (T[el.dataset.tPlaceholder]) el.placeholder = t(el.dataset.tPlaceholder); });
  // Nombres et dates dans la langue de la page (chiffres 0-9 en arabe).
  const lang = document.documentElement.lang || 'fr';
  const loc = lang === 'ar' ? 'ar-u-nu-latn' : lang;
  const num = (v, digits) => v.toLocaleString(loc, { minimumFractionDigits: digits, maximumFractionDigits: digits, useGrouping: false });
  const size = (b) => {
    if (b < 1024) return t('size_bytes', String(b));
    const u = ['size_kb', 'size_mb', 'size_gb', 'size_tb']; let v = b / 1024, i = 0;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return t(u[i], num(v, v >= 100 ? 0 : 1));
  };
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const queue = [];
  let busy = false;

  function addFiles(list) {
    for (const f of list) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<div class="name"><div>' + esc(f.name) + '</div><div class="meta">' + esc(t('web_waiting', size(f.size))) + '</div><div class="bar"><i></i></div></div>';
      q('#queue').prepend(row);
      queue.push({ f, row });
    }
    next();
  }

  function next() {
    if (busy || !queue.length) return;
    busy = true;
    const { f, row } = queue.shift();
    const meta = row.querySelector('.meta'), bar = row.querySelector('i');
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', '/up?k=' + encodeURIComponent(key) + '&name=' + encodeURIComponent(f.name));
    if (f.type) xhr.setRequestHeader('Content-Type', f.type);
    const t0 = Date.now();
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const pct = Math.round(e.loaded * 100 / e.total);
      const speed = e.loaded / Math.max(1, (Date.now() - t0) / 1000);
      bar.style.width = pct + '%';
      meta.textContent = t('web_progress', size(f.size), num(pct, 0), size(speed));
    };
    xhr.onload = () => {
      const ok = xhr.status === 200;
      bar.style.width = ok ? '100%' : bar.style.width;
      meta.innerHTML = esc(size(f.size)) + ' · ' + (ok ? '<span class="ok">' + esc(t('web_sent')) + '</span>'
        : '<span class="err">' + esc(t('web_failed', xhr.responseText || t('web_error_status', xhr.status))) + '</span>');
      done();
    };
    xhr.onerror = () => { meta.innerHTML = esc(size(f.size)) + ' · <span class="err">' + esc(t('web_connection_lost_wifi')) + '</span>'; done(); };
    xhr.send(f);
    function done() { busy = false; loadFiles(); next(); }
  }

  const drop = q('#drop');
  q('#pick').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
  ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => addFiles(e.dataTransfer.files));

  q('#sendText').addEventListener('click', async () => {
    const text = q('#text').value.trim();
    if (!text) return;
    q('#sendText').disabled = true;
    try {
      const r = await fetch('/text?k=' + encodeURIComponent(key), { method: 'POST', body: text });
      q('#textState').innerHTML = r.ok ? '<span class="ok">' + esc(t('web_shown_on_tv')) + '</span>' : '<span class="err">' + esc(t('web_failure')) + '</span>';
      if (r.ok) q('#text').value = '';
    } catch (e) {
      q('#textState').innerHTML = '<span class="err">' + esc(t('web_connection_lost')) + '</span>';
    }
    q('#sendText').disabled = false;
  });

  async function loadFiles() {
    try {
      const r = await fetch('/api/files?k=' + encodeURIComponent(key));
      if (r.status === 403) { q('#files').innerHTML = '<p class="err">' + esc(t('web_scan_qr')) + '</p>'; return; }
      const list = await r.json();
      q('#files').innerHTML = list.length ? list.map((f) =>
        '<div class="row"><div class="name"><div>' + esc(f.name) + '</div><div class="meta">' + esc(size(f.size)) + ' · ' +
        esc(new Date(f.added).toLocaleString(loc, { dateStyle: 'short', timeStyle: 'short' })) + '</div></div>' +
        '<a class="dl" href="/dl/' + f.id + '?k=' + encodeURIComponent(key) + '" download>' + esc(t('web_download')) + '</a>' +
        '<button class="del" data-id="' + f.id + '" data-name="' + esc(f.name) + '">' + esc(t('web_delete')) + '</button></div>').join('')
        : '<p class="empty">' + esc(t('web_no_files')) + '</p>';
    } catch (e) { /* box en veille : on réessaie */ }
  }
  q('#files').addEventListener('click', async (e) => {
    const b = e.target.closest('button.del');
    if (!b || !confirm(t('web_delete_confirm', b.dataset.name))) return;
    b.disabled = true;
    try {
      const r = await fetch('/api/files/' + b.dataset.id + '?k=' + encodeURIComponent(key), { method: 'DELETE' });
      if (!r.ok) alert(t('web_delete_failed'));
    } catch (err) { alert(t('web_connection_lost')); }
    loadFiles();
  });

  loadFiles();
  setInterval(() => { if (!busy) loadFiles(); }, 5000);
})();
</script>
</body>
</html>
